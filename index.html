<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification membre CJED</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f9;
  color:#222;
}
.container{
  max-width:500px;
  margin:auto;
  padding:25px 18px;
}
.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#0b6b4f;
  margin-bottom:10px;
}
.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}
.box{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}
input{
  width:100%;
  box-sizing:border-box;
  padding:15px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  margin-bottom:12px;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#0b6b4f;
  color:white;
  font-size:16px;
  font-weight:bold;
}
.result{
  margin-top:20px;
}
.card{
  border:1px solid #ddd;
  border-radius:15px;
  padding:20px;
  background:#fff;
}
.valid{
  color:#16803c;
  font-weight:bold;
}
.invalid{
  color:#d00000;
  font-weight:bold;
}
.info{
  margin:8px 0;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">CJED</div>
<div class="subtitle">
Vérification officielle des membres
</div>

<div class="box">

<h2>Vérifier un membre</h2>

<input
  type="text"
  id="memberId"
  placeholder="Entrez le numéro du membre"
>

<button onclick="verifier()">
VÉRIFIER
</button>

<div id="result" class="result"></div>

</div>
</div>

<script>

const URL_MEMBRES =
"https://raw.githubusercontent.com/moussa693/cjed-membres/main/members.json";

async function verifier(){

const id = document
.getElementById("memberId")
.value
.trim();

const result = document.getElementById("result");

if(!id){
result.innerHTML =
'<p class="invalid">❌ Veuillez entrer un numéro de membre.</p>';
return;
}

result.innerHTML = "Vérification en cours...";

try{

const response = await fetch(URL_MEMBRES);

if(!response.ok){
throw new Error("Impossible de charger les membres.");
}

const membres = await response.json();

const membre = membres.find(
m => String(m.id).trim() === id
);

if(!membre){

result.innerHTML = `
<div class="card">
<p class="invalid">❌ Membre non trouvé</p>
<p>Ce numéro de membre n'existe pas dans la base officielle du CJED.</p>
</div>
`;

return;
}

result.innerHTML = `
<div class="card">

<p class="valid">✅ MEMBRE VÉRIFIÉ</p>

<div class="info">
<strong>Numéro :</strong> ${membre.id || ""}
</div>

<div class="info">
<strong>Nom :</strong> ${membre.nom || ""}
</div>

<div class="info">
<strong>Prénom :</strong> ${membre.prenom || ""}
</div>

<div class="info">
<strong>Fonction :</strong> ${membre.fonction || ""}
</div>

<div class="info">
<strong>Cellule :</strong> ${membre.cellule || ""}
</div>

<div class="info">
<strong>Statut :</strong> ${membre.statut || ""}
</div>

<div class="info">
<strong>Expiration :</strong> ${membre.expiration || ""}
</div>

</div>
`;

}catch(error){

result.innerHTML = `
<p class="invalid">
❌ Erreur lors de la vérification.
</p>
`;

}

}

</script>

</body>
</html>
