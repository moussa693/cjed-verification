<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification membre CJED</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f9;
    color:#222;
}

.container{
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:48px;
    font-weight:bold;
    color:#08745b;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    font-size:22px;
    margin-bottom:35px;
}

.card{
    background:white;
    border-radius:28px;
    padding:35px 28px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
    font-size:40px;
    margin-top:0;
    margin-bottom:35px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:22px;
    font-size:20px;
    border:2px solid #ccc;
    border-radius:20px;
    margin-bottom:18px;
}

button{
    width:100%;
    padding:21px;
    border:0;
    border-radius:20px;
    background:#08745b;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.result{
    margin-top:35px;
    padding:28px;
    border:2px solid #ddd;
    border-radius:25px;
    background:#fff;
}

.success{
    color:#16863c;
    font-size:25px;
    font-weight:bold;
    margin-bottom:25px;
}

.error{
    color:#c62828;
    font-size:20px;
    font-weight:bold;
}

.info{
    font-size:19px;
    line-height:1.8;
}

.info strong{
    color:#222;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">CJED</div>

    <div class="subtitle">
        Vérification officielle des membres
    </div>

    <div class="card">

        <h1>Vérifier un membre</h1>

        <input
            type="text"
            id="memberId"
            placeholder="Entrez le numéro du membre"
        >

        <button onclick="verifierMembre()">
            VÉRIFIER
        </button>

        <div id="result" class="result hidden"></div>

    </div>

</div>

<script>

const idDepuisURL =
    new URLSearchParams(window.location.search).get("id");

if(idDepuisURL){
    document.getElementById("memberId").value = idDepuisURL;
    verifierMembre();
}

async function verifierMembre(){

    const id =
        document.getElementById("memberId").value.trim();

    const result =
        document.getElementById("result");

    if(!id){
        result.classList.remove("hidden");
        result.innerHTML =
            '<div class="error">❌ Veuillez entrer un numéro de membre.</div>';
        return;
    }

    result.classList.remove("hidden");
    result.innerHTML = "Vérification en cours...";

    try{

        const response =
            await fetch("members.json");

        if(!response.ok){
            throw new Error("Impossible de charger les membres.");
        }

        const data = await response.json();

        const members =
            Array.isArray(data)
                ? data
                : (data.members || []);

        const recherche = String(id).trim().toLowerCase();

        const membre = members.find(m => {

            const identifiant =
                String(
                    m.id ||
                    m.numero ||
                    m.numéro ||
                    m.memberId ||
                    m.numeroMembre ||
                    ""
                ).trim().toLowerCase();

            return identifiant === recherche;
        });

        if(!membre){

            result.innerHTML = `
                <div class="error">
                    ❌ MEMBRE NON TROUVÉ
                </div>
                <div class="info">
                    Aucun membre ne correspond au numéro :
                    <strong>${id}</strong>
                </div>
            `;

            return;
        }

        const nom =
            membre.nom || membre.name || "";

        const prenom =
            membre.prenom || membre.prénom || "";

        const fonction =
            membre.fonction || membre.function || "";

        const cellule =
            membre.cellule || "";

        const statut =
            membre.statut || membre.status || "";

        const expiration =
            membre.expiration ||
            membre.validite ||
            membre.validité ||
            "";

        result.innerHTML = `
            <div class="success">
                ✅ MEMBRE VÉRIFIÉ
            </div>

            <div class="info">

                <strong>Numéro :</strong>
                ${membre.id || id}
                <br>

                <strong>Nom :</strong>
                ${nom}
                <br>

                <strong>Prénom :</strong>
                ${prenom}
                <br>

                <strong>Fonction :</strong>
                ${fonction}
                <br>

                <strong>Cellule :</strong>
                ${cellule}
                <br>

                <strong>Statut :</strong>
                ${statut}
                <br>

                <strong>Expiration :</strong>
                ${expiration}

            </div>
        `;

    }catch(error){

        result.innerHTML = `
            <div class="error">
                ❌ ERREUR
            </div>
            <div class="info">
                ${error.message}
            </div>
        `;
    }
}

</script>

</body>
</html>
